# Pull requests are disabled on this repo, so these updates will not open
# until that setting is turned back on. The audit workflow still runs weekly.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
